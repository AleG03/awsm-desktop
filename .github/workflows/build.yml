# Builds the macOS application bundle and attaches it to a release.
#
# One bundle, universal: it carries both architectures, so there is nothing for
# anyone to choose. Two downloads meant choosing, and choosing wrong does not
# fail cleanly -- macOS runs the Intel one under Rosetta and warns about it,
# which reads as something being wrong with the application rather than with the
# download. The cost is about four megabytes.
#
# Only on a version tag: a build is something that happens when a version is
# cut, not on every push. Nothing here watches ordinary commits, so the tests
# and the formatting check run when the tag does -- which means a tag is the
# moment a mistake shows up. `make test` locally is what catches it earlier.
#
# macOS is the only job here because macOS is the only platform this can be
# built on: the bundle needs codesign and iconutil, and Wails links against the
# system frameworks. Windows is covered by a cross compile, which is cheap and
# real -- it catches a change to the platform specific files that does not
# compile. Linux is not: it needs a runner with the GTK and WebKit headers, and
# a job nobody has run is not a check.

name: build

on:
  push:
    tags: ["v*"]
  # For building without cutting a version, which is also how to try a change
  # to this file without tagging something to find out.
  workflow_dispatch:

permissions:
  contents: read

# A new push makes the previous run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20

    # Needed only by the last step, and only on a tag. Declared here because
    # permissions are per job rather than per step.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # The version in go.mod, so the runner and the working copy cannot
          # drift apart.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # The tests that exercise the real awsm skip themselves when it is not
        # installed, which on a runner is always. Everything else runs.
        run: go test ./...

      - name: Cross compile for Windows
        # Wails is pure Go on Windows, so this needs neither CGO nor any SDK:
        # a few seconds to catch a platform specific file that stopped
        # building.
        #
        # The architecture is named, because GOOS on its own leaves GOARCH as
        # the host's -- which on this runner is arm64, so the check was quietly
        # building for Windows on ARM and never for the machines anyone has.
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o /dev/null .

      - name: Build the universal bundle
        # Both architectures are compiled here and fused with lipo. The macOS
        # SDK carries both, so the Intel half needs no Intel runner.
        run: |
          # A tagged build names itself after the tag, so the version inside the
          # bundle and the version on the release cannot disagree. Everything
          # else keeps the default from build/package.sh.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ARCH=universal ./build/package.sh

      - name: Check the bundle came out whole
        # The architecture check is the one that matters. Compiling twice on one
        # runner and fusing the results is exactly the arrangement where the
        # second half quietly turns out to be a copy of the first -- and what
        # comes out then starts on half the Macs it claims to, which the person
        # who downloaded it discovers, not this workflow.
        run: |
          set -e
          app=dist/awsm.app

          test -x "$app/Contents/MacOS/awsm"
          test -f "$app/Contents/Resources/awsm.icns"

          # The plist is written by a heredoc, so a stray line in the script
          # ends up inside it. codesign does not mind: it falls back to an
          # identifier derived from a hash and signs anyway, which is how a
          # bundle with a corrupt Info.plist gets all the way to a release.
          plutil -lint "$app/Contents/Info.plist"
          id="$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")"
          if [ "$id" != io.github.aleg03.awsm.desktop ]; then
            echo "the bundle identifier is $id" >&2
            exit 1
          fi

          codesign --verify --verbose "$app"

          archs="$(lipo -archs "$app/Contents/MacOS/awsm")"
          for want in arm64 x86_64; do
            case " $archs " in
            *" $want "*) ;;
            *)
              echo "the bundle holds [$archs], with no $want in it" >&2
              exit 1
              ;;
            esac
          done
          echo "universal: $archs, signed"

      - name: Package the bundle
        # ditto rather than zip: it is what preserves a bundle's structure and
        # the executable bit, which uploading a directory would lose.
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/awsm.app dist/awsm-macos.zip
          ls -lh dist/awsm-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: awsm-macos
          path: dist/awsm-macos.zip
          if-no-files-found: error

      - name: Publish the release
        # Only on a version tag. Artifacts expire after ninety days and need a
        # GitHub login to fetch; a release is permanent and public, which is
        # what an application anybody is meant to install has to be.
        #
        # gh is already on the runner, so this needs no third party action.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/awsm-macos.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file - <<'NOTES'
          One download for every Mac: the bundle is universal and carries both
          Apple silicon and Intel.

          It is signed ad-hoc, which is enough to run and not enough for
          Gatekeeper to let it through on another machine. On first launch:
          right click the app and choose **Open**, or run

              xattr -d com.apple.quarantine /Applications/awsm.app

          Proper distribution would need a Developer ID and notarisation.
          NOTES
